services:
  procurement-assistant:
    build: .
    ports:
      - "8501:8501"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL_NAME=${OPENAI_MODEL_NAME:-gpt-4o-mini}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      - DEMO_MODE=${DEMO_MODE:-true}
    volumes:
      - ./outputs:/app/outputs
    restart: unless-stopped
